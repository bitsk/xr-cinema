[package]
name = "xr-cinema"
version = "0.3.2"
edition = "2021"
description = "Spatial video player for the openKylin XR desktop"

[dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
openxr = "=0.22.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cairo-rs = "0.20"
pangocairo = "0.20"

[profile.release]
lto = "thin"
